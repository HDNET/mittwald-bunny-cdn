name: Dependabot Auto-Merge

# Auto-merges Dependabot PRs that are patch / minor bumps once required
# CI checks pass. Major bumps are intentionally left for manual review —
# they have a real chance of breaking type-checks, build, or runtime
# behaviour and deserve a human looking at the changelog.
#
# Setup requirement: the repo must have "Allow auto-merge" enabled in
# Settings → General → Pull Requests. Without that switch the
# `--auto` flag below is a no-op.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
